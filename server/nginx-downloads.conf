location = /downloads/DiscodicXP.Launcher.exe {
    alias /srv/discodicxp-downloads/DiscodicXP.Launcher.exe;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="DiscodicXP.Launcher.exe"';
    add_header Cache-Control 'no-cache';
    add_header X-Content-Type-Options 'nosniff';
}

location = /downloads/DiscodicXP.Launcher.exe.sha256 {
    alias /srv/discodicxp-downloads/DiscodicXP.Launcher.exe.sha256;
    default_type text/plain;
    add_header Cache-Control 'no-cache';
    add_header X-Content-Type-Options 'nosniff';
}

location = /downloads/launcher/latest.json {
    alias /srv/discodicxp-downloads/launcher/latest.json;
    default_type application/json;
    add_header Cache-Control 'no-store';
    add_header X-Content-Type-Options 'nosniff';
}

location ~ "^/downloads/launcher/([a-f0-9]{64})\.exe$" {
    alias /srv/discodicxp-downloads/launcher/$1.exe;
    default_type application/octet-stream;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    add_header X-Content-Type-Options 'nosniff';
}
